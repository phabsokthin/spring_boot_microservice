

server:
  port: 8084

spring:
  application:
    name: auth-service

  # config db with postgress optional
  datasource:
    url: jdbc:postgresql://localhost:5432/dbusers
    # url: jdbc:postgresql://postgres-product:5432/dbproduct
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver

  # config jpa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      "[hibernate.format_sql]": true
  # end config jpa

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      # defaultZone: http://eureka-server:8761/eureka/ 