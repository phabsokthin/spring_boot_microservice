server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Product Service Route
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**

            # Order Service Route
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**

            # Client Service Route
            - id: client-service
              uri: lb://client-service
              predicates:
                - Path=/api/clients/**

eureka:
  client:
    service-url:
      # defaultZone: http://localhost:8761/eureka/
      defaultZone: http://eureka-server:8761/eureka/